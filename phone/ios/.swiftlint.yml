# 소스 폴더만 본다. 의존성 내려받기 결과(build)와 생성된 프로젝트는 뺀다.
included:
  - Aigyeot
  - Shared
  - AigyeotWidgets
  - AigyeotTests
  - AigyeotUITests
excluded:
  - build
  - Aigyeot.xcodeproj

line_length:
  warning: 160
  error: 250
  ignores_urls: true

# 짧은 지역 이름(m, t, s …)을 허용한다. 시험 이름은 한글 문장이라 길다.
identifier_name:
  min_length: 1
  max_length:
    warning: 100
    error: 200
  allowed_symbols: ["_"]
  excluded: [P, R, N, D]   # Gear(기어 P·R·N·D)의 값

# 시험 이름은 길어도 된다.
type_name:
  excluded: [DS, K]   # 디자인 시스템 별칭·키 이름 묶음
  max_length:
    warning: 60
    error: 80

# 판단 규칙과 연결 유지 흐름은 분기가 많다. 시험으로 모든 분기를 지킨다.
cyclomatic_complexity:
  warning: 25
  error: 40
function_body_length:
  warning: 100
  error: 200
type_body_length:
  warning: 400
  error: 700
file_length:
  warning: 800
  error: 1500
large_tuple:
  warning: 5
  error: 7
function_parameter_count:
  warning: 8
  error: 12

# SwiftUI의 `Button { } label: { }` 꼴이 이 규칙에 걸린다. 뷰 문법이라 그대로 둔다.
disabled_rules:
  - multiple_closures_with_trailing_closure

# 시험 도우미와 파서 안의 보조 타입 한 겹 더는 허용한다.
nesting:
  type_level:
    warning: 2
