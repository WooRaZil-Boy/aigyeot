# 소스 폴더만 본다. 의존성 내려받기 결과(build)와 생성된 프로젝트는 뺀다.
included:
  - Aigyeot
  - Shared
  - AigyeotWidgets
  - AigyeotTests
  - AigyeotUITests
excluded:
  - build
  - Aigyeot.xcodeproj

opt_in_rules:
  - sorted_imports
  - closure_spacing
  - operator_usage_whitespace
  - modifier_order
  - redundant_nil_coalescing
  - toggle_bool
  - empty_count
  - first_where
  - last_where
  - contains_over_first_not_nil
  - contains_over_filter_count
  - empty_string
  - joined_default_parameter
  - vertical_whitespace_closing_braces
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
  - fatal_error_message
  - overridden_super_call
  - prohibited_super_call

# 경고는 160자부터(기본 120자면 900여 줄이 떠 진짜 경고가 묻힌다). 오류는 기본값 200자.
line_length:
  warning: 160
  ignores_urls: true

# 경고는 기본값. 오류는 지금 최댓값(복잡도 32·함수 74줄·타입 371줄·튜플 5개) 바로 위로 잡았다. 쪼개는 일은 하지 않는다.
cyclomatic_complexity:
  error: 35
function_body_length:
  error: 80
type_body_length:
  error: 400
large_tuple:
  error: 6

# 짧은 지역 이름(m, t, s …)을 허용한다.
identifier_name:
  min_length: 1
  allowed_symbols: ["_"]
  excluded: [P, R, N, D]   # Gear(기어 P·R·N·D)의 값

type_name:
  excluded: [DS, K]   # 디자인 시스템 별칭·키 이름 묶음

# SwiftUI의 `Button { } label: { }` 꼴이 이 규칙에 걸린다. 뷰 문법이라 그대로 둔다.
disabled_rules:
  - multiple_closures_with_trailing_closure
