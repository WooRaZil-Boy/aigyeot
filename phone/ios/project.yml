name: Aigyeot
options:
  bundleIdPrefix: kr.aigyeot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 서명은 비워 둔다. 기기 설치·TestFlight 때 Xcode에서 팀을 고른다.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
# 인계 알림 원격 푸시(계약 5.3·5.4: iOS도 FCM 토큰을 중계에 보낸다). 설정 파일 GoogleService-Info.plist는 공개하지 않는다(.gitignore).
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
targets:
  Aigyeot:
    type: application
    platform: iOS
    sources: [Aigyeot, Shared]
    dependencies:
      - target: AigyeotWidgets   # 잠금 화면 진행 표시(C6). 앱 안에 넣는다
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: Aigyeot/Aigyeot.entitlements
      properties:
        aps-environment: development   # 원격 푸시(5.3). 배포 서명 때 Xcode가 production으로 바꾼다
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.aigyeot.phone
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # 중계 주소. 시뮬레이터의 로컬 중계는 localhost:8787(계약 0장). release 주소는 배포 뒤에 맞춘다(미정).
        Debug:
          RELAY_BASE_URL: "http://localhost:8787"
          # Debug만 로컬 평문 HTTP를 허용한다(아래 스크립트가 ATS 항목을 더한 사본을 만든다). Release는 HTTPS·WSS만.
          INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/Info-Debug.plist"
          ENABLE_USER_SCRIPT_SANDBOXING: NO
        Release:
          RELAY_BASE_URL: "https://aigyeot-relay.workers.dev"
    preBuildScripts:
      - name: Debug용 Info.plist(로컬 평문 허용)
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/Info-Debug.plist
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            cp "$SRCROOT/Aigyeot/Info.plist" "$DERIVED_FILE_DIR/Info-Debug.plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$DERIVED_FILE_DIR/Info-Debug.plist"
          fi
    info:
      path: Aigyeot/Info.plist
      properties:
        CFBundleDisplayName: 아이곁
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        RelayBaseURL: "$(RELAY_BASE_URL)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 차 화면의 QR을 찍어 차와 연결하는 데만 카메라를 써요.
        NSMicrophoneUsageDescription: 아기에게 불러 줄 노래를 녹음하는 데만 마이크를 써요.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: kr.aigyeot.pair
            CFBundleURLSchemes: [aigyeot]
  AigyeotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AigyeotTests]
    dependencies:
      - target: Aigyeot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: kr.aigyeot.phone.tests
  # 잠금 화면·Dynamic Island의 진행 중 수유·잠(Live Activity). '끝내기'는 앱 프로세스에서 돈다(Shared/CareActivity.swift).
  AigyeotWidgets:
    type: app-extension
    platform: iOS
    sources: [AigyeotWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.aigyeot.phone.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: AigyeotWidgets/Info.plist
      properties:
        CFBundleDisplayName: 아이곁
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # 화면 캡처 순회(시험이 아님). 기본 스킴의 시험에는 넣지 않는다.
  AigyeotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AigyeotUITests]
    dependencies:
      - target: Aigyeot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: kr.aigyeot.phone.uitests
        TEST_TARGET_NAME: Aigyeot
schemes:
  Aigyeot:
    build:
      targets:
        Aigyeot: all
        AigyeotTests: [test]
    test:
      targets: [AigyeotTests]
  AigyeotScreens:
    build:
      targets:
        Aigyeot: all
        AigyeotUITests: [test]
    test:
      targets: [AigyeotUITests]
